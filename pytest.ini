[pytest]
testpaths = tests
filterwarnings =
    # LLMChain is required by the assignment even though LangChain recommends `prompt | llm`.
    ignore:The class `LLMChain` was deprecated:DeprecationWarning
    ignore::DeprecationWarning:langchain_community
    ignore:.*langchain-community.*is being sunset:DeprecationWarning
    ignore:The default value of `allowed_objects`
